services:
  postgres:
    image: postgres:16-alpine
    container_name: naluautomation_relation_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-nalu_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: naluautomation_cache
    ports:
      - "6379:6379"
    volumes: 
      - redis_data:/data
    command: sh -c 'redis-server --save 60 1 --loglevel warning --requirepass "$${REDIS_PASSWORD:-redis_password}"'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
    restart: unless-stopped

  rabbitmq:
      image: rabbitmq:3-management-alpine
      container_name: naluautomation_message_queue
      environment:
        - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
        - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
      ports: 
        - "5672:5672" 
        - "15672:15672" 
      volumes: 
        - rabbitmq_data:/var/lib/rabbitmq
      restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
  
  